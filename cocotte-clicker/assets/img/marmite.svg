<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 230">
  <!-- Cocotte « maker » : émail orange, bouton écrou, lunettes de protection, autocollant -->
  <ellipse cx="130" cy="216" rx="96" ry="10" fill="#000" opacity=".18"/>
  <g stroke="#000" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- anses boulonnées -->
    <rect x="12" y="112" width="48" height="28" rx="14" fill="#3a3a3a"/>
    <rect x="200" y="112" width="48" height="28" rx="14" fill="#3a3a3a"/>
    <!-- corps -->
    <path d="M46 100h168v52c0 34-26 54-58 54h-52c-32 0-58-20-58-54z" fill="#F07E36"/>
  </g>
  <circle cx="30" cy="126" r="4.5" fill="#cfcfcf"/><circle cx="230" cy="126" r="4.5" fill="#cfcfcf"/>
  <!-- ombre et reflet d'émail -->
  <path d="M60 178c12 18 30 24 44 24h52c14 0 32-6 44-24" stroke="#c4561b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M62 116v30c0 10 3 18 8 24" stroke="#fff" stroke-opacity=".55" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- bord émaillé -->
  <rect x="36" y="90" width="188" height="20" rx="10" fill="#FFF4D6" stroke="#000" stroke-width="5"/>
  <!-- couvercle -->
  <path d="M50 92c6-40 44-58 80-58s74 18 80 58z" fill="#F07E36" stroke="#000" stroke-width="5" stroke-linejoin="round"/>
  <path d="M72 70c10-14 26-21 40-23" stroke="#fff" stroke-opacity=".55" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- lunettes de protection relevées sur le couvercle -->
  <path d="M56 78c24-18 124-18 148 0" stroke="#3C2472" stroke-width="10" fill="none" stroke-linecap="round"/>
  <g stroke="#000" stroke-width="4">
    <rect x="92" y="52" width="34" height="26" rx="11" fill="#bfe6f2"/>
    <rect x="134" y="52" width="34" height="26" rx="11" fill="#bfe6f2"/>
    <path d="M126 64h8" stroke-width="5"/>
  </g>
  <path d="M100 60l8-4M142 60l8-4" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- bouton du couvercle : écrou -->
  <polygon points="146,24 138,38 122,38 114,24 122,10 138,10" fill="#d4d4d4" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="130" cy="24" r="5.5" fill="#777" stroke="#000" stroke-width="2"/>
  <!-- visage chibi -->
  <ellipse cx="102" cy="146" rx="12" ry="15" fill="#000"/>
  <ellipse cx="158" cy="146" rx="12" ry="15" fill="#000"/>
  <circle cx="106" cy="140" r="4.5" fill="#fff"/><circle cx="98" cy="152" r="2" fill="#fff"/>
  <circle cx="162" cy="140" r="4.5" fill="#fff"/><circle cx="154" cy="152" r="2" fill="#fff"/>
  <ellipse cx="80" cy="166" rx="11" ry="6" fill="#E41E6C" opacity=".9"/>
  <ellipse cx="180" cy="166" rx="11" ry="6" fill="#E41E6C" opacity=".9"/>
  <path d="M120 160q10 14 20 0z" fill="#000" stroke="#000" stroke-width="3" stroke-linejoin="round"/>
  <path d="M125 166q5 4 10 0" stroke="#E41E6C" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- autocollant du lieu -->
  <g transform="rotate(-12 196 184)">
    <circle cx="196" cy="184" r="14" fill="#FCD260" stroke="#000" stroke-width="3"/>
    <text x="196" y="190" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" text-anchor="middle">C'</text>
  </g>
  <g transform="rotate(10 66 190)">
    <rect x="54" y="180" width="24" height="18" rx="4" fill="#90C060" stroke="#000" stroke-width="3"/>
    <path d="M60 186l6-3 6 3v6l-6 3-6-3z" fill="none" stroke="#000" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
